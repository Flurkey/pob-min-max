[project]
name = "pob-knowledge"
version = "0.1.0"
description = "Game-data import for PoE Forge. Reads the pinned Path of Building checkout."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[project.scripts]
pob-knowledge = "pob_knowledge.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pob_knowledge = ["*.lua"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
